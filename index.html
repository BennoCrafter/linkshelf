<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#2b5fd9">
<meta name="theme-color" content="#2b5fd9">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="topbar">
      <h1>// links</h1>
      <span id="copy-toast">copied</span>
      <button id="copy-btn" type="button" aria-label="copy share link" title="copy share link">copy link</button>
      <button id="edit-toggle" type="button" aria-label="edit" title="edit">✎</button>
    </div>

    <form id="add-form">
      <span class="prompt">+</span>
      <input type="text" id="title-input" placeholder="title" required maxlength="120">
      <input type="url" id="url-input" placeholder="https://example.com" required>
      <button type="submit">add</button>
    </form>

    <ul id="list"></ul>
    <p id="empty-state">no links yet</p>
  </main>

  <dialog id="color-dialog">
    <div class="swatches" id="swatches"></div>
    <label class="custom-color">
      <input type="color" id="custom-color-input">
      custom
    </label>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
