<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="topbar">
      <h1>// links</h1>
      <button id="edit-toggle" type="button" aria-label="edit" title="edit">✎</button>
    </div>

    <form id="add-form">
      <span class="prompt">+</span>
      <input type="text" id="title-input" placeholder="title" required maxlength="120">
      <input type="url" id="url-input" placeholder="https://example.com" required>
      <button type="submit">add</button>
    </form>

    <ul id="list"></ul>
    <p id="empty-state">no links yet</p>
  </main>

  <dialog id="color-dialog">
    <div class="swatches" id="swatches"></div>
    <label class="custom-color">
      <input type="color" id="custom-color-input">
      custom
    </label>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
